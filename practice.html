<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-24T17:18:45Z","version":"2027.2.0","commit":"070537a"},"course":{"id":"ds-205","code":"DS-205","title":"Designing and Reading Experiments","track":"data-science","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/ds-205/","repo":"SDAIAAcademy/ds-205","home":"index.html","outcomes":[{"id":"LO1","text":"Distinguish a randomised experiment, a quasi-experiment and an observational comparison, and explain the causal claim each supports, given six study descriptions from public services"},{"id":"LO2","text":"Draft a pre-registration stating the decision, hypothesis, unit of randomisation, primary and guardrail metrics, stop rule and analysis plan, given the office's question about renewal reminders"},{"id":"LO3","text":"Compute the sample size and run time needed to detect a minimum effect of interest and check it by simulation, given baseline renewal rates, daily traffic and the office's minimum effect"},{"id":"LO4","text":"Analyse a completed two-arm experiment with a difference in proportions, a confidence interval and a sample ratio mismatch test, given a synthetic log of 60,000 renewal notices"},{"id":"LO5","text":"Measure by simulation the false-positive rate caused by peeking, many metrics and analysis at the wrong unit, given simulated A/A tests with no true effect"},{"id":"LO6","text":"Review a reported experiment and decide whether it supports the decision it claims to support, given write-ups with seeded flaws, one in class and one in the capstone"}],"unit":"day","units":[{"n":1,"id":"day1","label":"Day 1","title":"Design","sessions":[{"n":1,"label":"Session 1","title":"Which claims need an experiment"},{"n":2,"label":"Session 2","title":"Decision, hypothesis and metrics"},{"n":3,"label":"Session 3","title":"Choosing the unit of randomisation"},{"n":4,"label":"Session 4","title":"Pre-registration"}]},{"n":2,"id":"day2","label":"Day 2","title":"Size and run","sessions":[{"n":1,"label":"Session 1","title":"Power and the minimum effect"},{"n":2,"label":"Session 2","title":"Power by simulation"},{"n":3,"label":"Session 3","title":"Cluster randomisation"},{"n":4,"label":"Session 4","title":"Run time and seasonality"}]},{"n":3,"id":"day3","label":"Day 3","title":"Read the result","sessions":[{"n":1,"label":"Session 1","title":"Did randomisation work"},{"n":2,"label":"Session 2","title":"Estimate, interval and effect"},{"n":3,"label":"Session 3","title":"False wins by simulation"},{"n":4,"label":"Session 4","title":"Reviewing a reported result"}]},{"n":4,"id":"capstone","label":"Capstone","title":"Capstone: the design and analysis pack and its defence","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-which-design-q1","type":"single","prompt":"Mansour Al-Khelaiwi wants to know whether evening opening shortens waits. Four studies are possible. Which one supports \"evening opening caused shorter waits\" without a further assumption?","options":[{"key":"A","text":"Compare the branches whose managers asked for evening opening with the rest"},{"key":"B","text":"Draw 12 of the 24 branches by a recorded lottery for evening opening and compare with the other 12"},{"key":"C","text":"Open all branches in the evening from June and compare waits before and after"},{"key":"D","text":"Compare the waits of evening visitors with those of daytime visitors"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the lottery lets chance decide which branches change. The other three compare groups that chose or periods that differ.","misconceptions":["Managers who ask for evening opening differ from the others, and so do their branches: the groups chose","","Anything else that changed in the same months is mixed into the difference: there is no group without the change","Visitors who come in the evening differ from daytime visitors: they chose their slot"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-which-design","title":"Which study lets the office say \"caused\"?"},"level":null,"pool":"checkpoint"},{"id":"check-primary-metric-q1","type":"single","prompt":"Rehab Al-Tayyar's team redesigned the online application form so that more applicants finish it. Which is the primary metric of the test?","options":[{"key":"A","text":"Mean time spent on each page of the form"},{"key":"B","text":"Validation errors per page view"},{"key":"C","text":"Whichever of completion, errors and time improves most"},{"key":"D","text":"The share of applicants who complete the application"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision is about finished applications. Errors and time explain a result; they do not decide it.","misconceptions":["Measures activity on the page, not whether the applicant got what they came for: a confusing page also holds people longer","An intermediate step: fewer error messages help only if more applications are finished","Leaves the choice until the data are in, which is a second and third chance of a win",""],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-primary-metric","title":"Which metric should carry the decision?"},"level":null,"pool":"checkpoint"},{"id":"check-unit-q1","type":"single","prompt":"The office wants to test a shorter text on the ticket that the queue machine prints. All visitors of a branch wait in one hall and watch one display. What is the unit of randomisation?","options":[{"key":"A","text":"The branch, or the staff pool where branches share staff"},{"key":"B","text":"The visitor: each ticket printed gets a coin"},{"key":"C","text":"The day: the short text on alternate days in every branch"},{"key":"D","text":"The ticket: it is what the machine logs"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Whatever shares a hall, a queue and a team must land in one arm together. The price is paid in the number of units.","misconceptions":["","Visitors in one hall see each other's tickets and share one queue: a visitor's treatment reaches the next visitor","A day in one branch follows the day before: staff and repeat visitors carry the change across days, and days are few","The ticket is the row in the log, not a unit: one visitor may take several tickets"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-unit","title":"Whom do you toss the coin for?"},"level":null,"pool":"checkpoint"},{"id":"check-after-data-q1","type":"single","prompt":"On day 10 of the reminder test the team has three ideas. Which one is compatible with the pre-registration?","options":[{"key":"A","text":"Make counter visits the primary metric, because they are moving more clearly"},{"key":"B","text":"End the test today, because the difference is already significant"},{"key":"C","text":"Add days until renewal as an exploratory metric, labelled as added on day 10"},{"key":"D","text":"Drop holders whose reminder bounced from the reminder arm"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"You may add, with a date and a label. You may not change what decides, when it stops or who counts.","misconceptions":["Chooses the metric after seeing interim data: the new headline is selected because it looks better","Stops for a good result, which the stop rule forbids and which inflates false wins","","Removes holders from one arm only, after assignment: the arms stop being comparable"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-after-data","title":"The test is running. What may still change?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Four pre-registrations for the reminder test differ in one line each. Which line is acceptable?","options":[{"key":"A","text":"Primary metric: on-time renewal or counter visits, whichever is clearer"},{"key":"B","text":"Unit: the renewal notice, since that is what the platform sends"},{"key":"C","text":"Stop rule: 28 days, one analysis at the end, a safety look at the guardrails on day 14"},{"key":"D","text":"Guardrail: we will keep an eye on complaints"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A fixed end, one analysis of the primary metric, and an early look that reads only the guardrails.","misconceptions":["Leaves the choice of metric until the data are in: two chances of a win","A holder with several permits can land in both arms","","No threshold and no action: nothing can stop the test"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which page is ready to sign?"},"level":null,"pool":"checkpoint"},{"id":"check-halving-q1","type":"single","prompt":"A test needs 6,000 residents per arm to detect 3 points. The director now says she would act on 1.5 points. About how many residents per arm does the test need?","options":[{"key":"A","text":"24,000"},{"key":"B","text":"12,000"},{"key":"C","text":"6,000"},{"key":"D","text":"1,500"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The effect is squared in the denominator. Half the effect, four times the size.","misconceptions":["","Scales the size in proportion to the effect and not to its square","Assumes the size does not depend on the effect once the test is planned","Divides where the formula multiplies: a smaller effect is harder to see, not easier"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-halving","title":"What does a smaller minimum effect cost?"},"level":null,"pool":"checkpoint"},{"id":"check-simulated-power-q1","type":"single","prompt":"You simulate a planned test 1,000 times with a true effect of 2 points. 81% of the simulated tests are significant. Which statement is correct?","options":[{"key":"A","text":"There is an 81% chance that the reminder works"},{"key":"B","text":"If the real test is significant, the effect is real with probability 81%"},{"key":"C","text":"The reminder will raise on-time renewal by 81% of 2 points"},{"key":"D","text":"If the effect is really 2 points, a test of this design finds it about 81 times in 100"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Power is a statement about the design under an assumed effect: how often it finds what is there.","misconceptions":["Reads power as the chance that the hypothesis is true, which no test provides","Turns a property of the design into a statement about one finished test","Confuses power with the size of the effect",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-simulated-power","title":"What does a simulated power of 81% tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-clusters-q1","type":"single","prompt":"A ministry tests a new enrolment procedure in 16 schools, 8 with it and 8 without. Each school enrols about 600 pupils. The outcome is whether a pupil's file is complete on the first day. What decides the power of the test most?","options":[{"key":"A","text":"The 9,600 pupils"},{"key":"B","text":"The 16 schools and how much schools differ from each other"},{"key":"C","text":"The 600 pupils in each school"},{"key":"D","text":"The 5% significance level"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Schools were randomised, so the test has 16 units. Differences between schools are the noise it must overcome.","misconceptions":["Counts rows: pupils in one school share its staff and its habits, so they are not 9,600 independent observations","","Within-school sample size shrinks only the small sampling part of each school's rate","The level of the test sets the false-win rate, not how much information 16 schools carry"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-clusters","title":"How large is this test?"},"level":null,"pool":"checkpoint"},{"id":"check-stop-date-q1","type":"single","prompt":"A test of a new payment page starts on a Sunday. The planned size is reached on day 11. Traffic is low at weekends and salaries arrive on the 27th, after which payments surge. Day 11 is the 16th of the month. What duration do you choose?","options":[{"key":"A","text":"11 days"},{"key":"B","text":"14 days"},{"key":"C","text":"28 days"},{"key":"D","text":"As long as it takes to reach significance"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Whole weeks, and the salary surge inside the window. From the 6th, 28 days reach past the 27th.","misconceptions":["Stops when the size is reached and ignores that the window holds unequal numbers of each weekday","Covers whole weeks and still misses the days after the 27th, when behaviour differs","","Runs until the result is clear, which is peeking by another name"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-stop-date","title":"How long should this test run?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A test needs 9,000 residents per arm for its minimum effect. Traffic is 2,000 residents a day, lower at weekends, with a surge at the month-end. Which plan do you accept?","options":[{"key":"A","text":"Run 9 days, until 18,000 residents are in"},{"key":"B","text":"Run 28 days: whole weeks, with the month-end inside"},{"key":"C","text":"Run 9 days with 4,500 per arm to finish sooner"},{"key":"D","text":"Run until the difference is significant"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The formula gives the minimum size. The calendar gives the duration: whole cycles.","misconceptions":["Reaches the size and counts some weekdays twice and others once, with no month-end","","Halves the size, which cuts the power for the stated minimum effect far below 80%","Lets the result decide the duration, which is peeking"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which plan gives the test a fair chance?"},"level":null,"pool":"checkpoint"},{"id":"check-failed-ratio-q1","type":"single","prompt":"A form test planned a 50/50 split. The log shows 10,480 applicants on the old form and 9,720 on the new one (p below 0.0001). The new form shows a higher completion rate. What do you do first?","options":[{"key":"A","text":"Report the higher completion rate, with a note that the arms were unequal"},{"key":"B","text":"Delete 760 applicants at random from the old form's arm"},{"key":"C","text":"Reweight the new form's arm so that both arms count the same"},{"key":"D","text":"Find which applicants are missing from the new form's arm, and why"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Unequal counts mean that something other than the coin decided who is in the data. Until you know what, no comparison can be trusted.","misconceptions":["Reads the result of a comparison that is known to be broken","Forces equal counts without knowing which units are missing: the arms stay incomparable","Assumes the missing applicants are a random handful, which is the thing in doubt",""],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-failed-ratio","title":"The ratio check has failed. What now?"},"level":null,"pool":"checkpoint"},{"id":"check-interval-reading-q1","type":"single","prompt":"A test of a new letter has a minimum effect of 3 points. The result: +1.2 points, 95% interval +0.4 to +2.0, p = 0.003. Which sentence is right?","options":[{"key":"A","text":"The letter helps, by less than the 3 points that would justify it"},{"key":"B","text":"The letter is highly effective: the result is significant at 0.003"},{"key":"C","text":"The letter has no effect, since it missed the minimum effect"},{"key":"D","text":"The test is inconclusive and should run longer"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The whole interval is above zero and below 3 points: a real gain, too small to act on.","misconceptions":["","Reads a small p-value as a large or important effect","Treats 'below the minimum' as 'no effect', although zero is outside the interval","Asks for more data when the interval already rules out the minimum effect"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-interval-reading","title":"How do you report this result?"},"level":null,"pool":"checkpoint"},{"id":"check-which-trap-q1","type":"single","prompt":"A team planned a 4-week test of a new queue screen in 30 branches with one primary metric. They analysed it once, at the end, and report: \"average wait fell, p = 0.01, n = 41,000 visits\". Which trap should you check first?","options":[{"key":"A","text":"Peeking"},{"key":"B","text":"Many metrics"},{"key":"C","text":"Wrong unit of analysis"},{"key":"D","text":"Novelty"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Branches were randomised and visits were counted. The test has 30 units, and \"n = 41,000\" is the sign that they were not the ones analysed.","misconceptions":["The team looked once, at the planned end","One primary metric was named in advance and reported","","Four weeks is a full cycle; novelty is possible but is not what the reported n points to"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-which-trap","title":"Which habit produced this win?"},"level":null,"pool":"checkpoint"},{"id":"check-supported-decision-q1","type":"single","prompt":"A write-up reports a randomised test of a new appointment text, analysed as pre-registered: missed appointments fell by 1.9 points (0.4 to 3.4), against a minimum effect of 1.5. It then recommends the text \"for all clinics, and for vaccination reminders too\". The test ran in the city's eight clinics. What do you write?","options":[{"key":"A","text":"Reject the write-up: the claim goes beyond the evidence"},{"key":"B","text":"Adopt the text for appointments in the eight clinics; test vaccination reminders separately"},{"key":"C","text":"Accept the recommendation as written: the test was sound"},{"key":"D","text":"Ask for a longer test before deciding anything"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The test supports what it tested: this text, for appointments, in these clinics. The rest is a new hypothesis.","misconceptions":["Throws out a sound result because the recommendation overreaches","","Accepts an extension to a different message and purpose that nobody tested","Asks for more data although the estimate meets the minimum and the analysis was as planned"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-supported-decision","title":"Which decision does the evidence support?"},"level":null,"pool":"checkpoint"},{"id":"q-design-01","type":"single","prompt":"A city library offers a new late-return text alert. Members opt in at the desk. After three months, members with the alert return 12 points more books on time than members without it. What kind of study is this?","options":[{"key":"A","text":"A randomised experiment, because two groups are compared"},{"key":"B","text":"A quasi-experiment, because the alert started on a fixed date"},{"key":"C","text":"An observational comparison, because members chose the alert"},{"key":"D","text":"A lottery, because not every member received the alert"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Members decided for themselves whether to opt in, so the two groups may differ in many ways besides the alert. That is an observational comparison.","misconceptions":["Takes any two-group comparison for an experiment: what matters is how the groups were formed","Sees a date and assumes a rule created the groups: here members chose","","Confuses partial coverage with assignment by chance"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"three-designs","title":"Three designs support three different claims"},"level":"understand","pool":"practice"},{"id":"q-design-02","type":"single","prompt":"A transport office finds that drivers who use its mobile app renew their licences on time 20 points more often than drivers who do not. A simulation shows that conscientious drivers both install the app more and renew on time more. What does the 20-point gap mostly measure?","options":[{"key":"A","text":"The difference between conscientious drivers and the others"},{"key":"B","text":"The effect of the app on every driver who chooses to install it this year"},{"key":"C","text":"The sampling error of a survey of drivers"},{"key":"D","text":"The effect of on-time renewal on app use"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A trait that drives both app use and renewal is mixed into the comparison. The gap is mostly that trait, not the app.","misconceptions":["","Reads a gap between groups that chose as the effect of the thing they chose","Mistakes a stable bias for noise: a larger survey would show the same gap","Reverses the direction without removing the hidden trait that drives both"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"groups-that-chose","title":"Groups that chose differ in more than the thing they chose"},"level":"analyze","pool":"practice"},{"id":"q-design-03","type":"single","prompt":"Three separate surveys of clinic patients all find that patients who booked online miss fewer appointments, by 9, 10 and 11 points. A manager says the agreement proves that online booking reduces missed appointments. What is the best reply?","options":[{"key":"A","text":"Three surveys are too few; ten would settle it"},{"key":"B","text":"The surveys share one weakness: patients chose how to book"},{"key":"C","text":"The surveys disagree by 2 points, so none can be trusted"},{"key":"D","text":"The effect is real, since chance cannot produce it three times"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Agreement between studies that share the same bias shows that the bias is stable, not that the claim is true. All three compare patients who chose.","misconceptions":["Treats bias as noise that more studies average away","","Reads ordinary sampling variation as a contradiction","Rules out chance and forgets that a shared bias repeats just as reliably"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"bias-is-not-noise","title":"More data cure noise. They do not cure bias"},"level":"understand","pool":"practice"},{"id":"q-design-04","type":"single","prompt":"A municipality waives a parking fee for cars registered before 2015. An analyst compares permit renewals of cars registered in late 2014 with cars registered in early 2015. On which assumption does a causal reading rest?","options":[{"key":"A","text":"That the two groups have the same number of cars"},{"key":"B","text":"That owners chose their registration year at random"},{"key":"C","text":"That renewals were measured in the same month for all cars"},{"key":"D","text":"That nothing but the fee changes at the 2015 line"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A comparison just either side of a cut-off supports a causal claim if units near the line are alike and nothing else switches at the line.","misconceptions":["Looks for equal group sizes, which matter for precision and not for the causal claim","Asks for randomisation, which a rule at a cut-off does not need or provide","Names a measurement detail in place of the assumption the design rests on",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"quasi-rests-on-an-assumption","title":"A quasi-experiment is as strong as the assumption you can defend"},"level":"analyze","pool":"practice"},{"id":"q-design-05","type":"single","prompt":"A housing office has 300 places on a home-repair scheme and 1,400 eligible applicants. Places are allocated by a recorded random draw. One year later, energy bills of the two groups are compared. Which claim does the comparison support?","options":[{"key":"A","text":"The scheme lowered bills for applicants like these"},{"key":"B","text":"The scheme lowers bills for every household in the city"},{"key":"C","text":"Households on the scheme have lower bills; the reason is unknown"},{"key":"D","text":"The scheme lowers bills only if bills were moving in parallel before"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A recorded random draw is random assignment. It supports a causal claim for the applicants who were in the draw.","misconceptions":["","Extends the result beyond the units that were in the draw","Treats a lottery as an observational comparison because nobody planned a study","Borrows the assumption of a before-and-after comparison that a random draw does not need"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"three-designs","title":"Three designs support three different claims"},"level":"apply","pool":"practice"},{"id":"q-design-06","type":"single","prompt":"A health centre knows from strong earlier trials that a reminder call reduces missed vaccinations. A manager proposes a new test in which half of the parents get no call, to measure the effect locally. What is the main objection?","options":[{"key":"A","text":"The test would need too many parents to reach significance"},{"key":"B","text":"The local effect cannot differ from the earlier trials"},{"key":"C","text":"Half of the parents would be denied a benefit shown to work"},{"key":"D","text":"Parents cannot be randomised without written consent in every case"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Withholding is acceptable when nobody knows whether the change helps. Here the benefit is established, so a no-call arm denies a known benefit.","misconceptions":["Raises a size question when the problem is whether the test should be run at all","Assumes that results transfer exactly, which is a separate and weaker point","","States a blanket rule the scenario does not give"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"when-not-to-randomise","title":"Some questions should not be answered with an experiment"},"level":"evaluate","pool":"practice"},{"id":"q-prereg-01","type":"single","prompt":"Four teams wrote the decision line of a pre-registration for a new queue ticket. Which line gives the director a rule she can apply on the last day?","options":[{"key":"A","text":"We will learn whether the new ticket improves the experience of visitors in our branches"},{"key":"B","text":"If waits fall by at least 2 minutes and complaints do not rise, we adopt it"},{"key":"C","text":"If the result is significant we adopt the ticket in all branches"},{"key":"D","text":"We adopt the ticket unless the test shows that it is harmful"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A decision line names the action for each result and contains the number that separates them.","misconceptions":["States curiosity, not a decision: no action follows from any result","","Ties the decision to significance, which says nothing about whether the gain is large enough","Decides in advance: the test can only confirm what was going to happen anyway"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"decision-first","title":"Start from the decision the result will change"},"level":"evaluate","pool":"practice"},{"id":"q-prereg-02","type":"numeric","prompt":"A text reminder costs 0.30 riyals per resident. Each missed bulky-waste collection costs the city 15 riyals. By how many points must the reminder reduce missed collections to pay for itself?","options":[],"correct":[],"answer":2,"tolerance":0,"unit":"points","explanation":"Break-even is the cost per resident over the cost of one miss: 0.30 / 15 = 0.02, which is 2 points.","misconceptions":[],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"minimum-effect-from-costs","title":"The minimum effect is the smallest gain that changes the decision"},"level":"apply","pool":"practice"},{"id":"q-prereg-03","type":"single","prompt":"On-time payment is 40%. A report says a new letter raised it 'by 5%'. A colleague reads this as 45%, another as 42%. Which wording removes the doubt?","options":[{"key":"A","text":"It raised on-time payment by 5 per cent of payers"},{"key":"B","text":"It raised on-time payment significantly, by 5%"},{"key":"C","text":"It raised on-time payment by roughly a twentieth of all payers"},{"key":"D","text":"It raised on-time payment by 5 points, from 40% to 45%"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"'Points' names the difference between two percentages, and giving both rates leaves no room for the relative reading.","misconceptions":["Keeps the ambiguous word and adds a second ambiguity","Adds a statistical word that does not say which 5% is meant","Chooses the relative reading without saying so",""],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"minimum-effect-from-costs","title":"The minimum effect is the smallest gain that changes the decision"},"level":"understand","pool":"practice"},{"id":"q-prereg-04","type":"single","prompt":"A tax office tests a firmer payment letter. Which of these is a complete guardrail?","options":[{"key":"A","text":"We will monitor complaints closely throughout the test"},{"key":"B","text":"Complaints must not rise; if they do, we will discuss it"},{"key":"C","text":"If the complaint rate exceeds control by 1 point, pause and review the letter"},{"key":"D","text":"Complaints are a secondary metric and will be reported"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A guardrail has a metric, a threshold and the action taken when the threshold is crossed.","misconceptions":["Names a metric without a threshold or an action","Has no number, so 'rise' will be argued about afterwards","","Confuses a metric that explains with one that can stop the test"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"guardrails-with-thresholds","title":"A guardrail has a metric, a threshold and an action"},"level":"evaluate","pool":"practice"},{"id":"q-prereg-05","type":"single","prompt":"A utility tests two versions of its bill. Its system tosses a coin for every bill printed. One customer in four has several meters and gets several bills. What goes wrong?","options":[{"key":"A","text":"Customers with several meters would see both versions"},{"key":"B","text":"The arms will have unequal numbers of bills"},{"key":"C","text":"Bills cannot be analysed because they are not people"},{"key":"D","text":"The test will need four times as many bills to reach the same power"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A person who receives both versions is in both arms. The unit must be the customer, so that every bill of a customer lands in one arm.","misconceptions":["","Expects a coin per bill to unbalance the counts, which it does not","Rejects the row as a unit for the wrong reason","Invents a size penalty where the problem is who receives which version"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"notices-of-one-holder","title":"One holder in five has several permits, and their notices move together"},"level":"analyze","pool":"practice"},{"id":"q-prereg-06","type":"single","prompt":"A school district wants to test a new homework platform. Pupils in a class work together and share one teacher. Three pairs of small schools share their teaching staff. What should be randomised?","options":[{"key":"A","text":"Pupils, since there are far more of them"},{"key":"B","text":"Classes, since pupils in a class share a teacher"},{"key":"C","text":"Schools, treating each pair that shares staff as one unit"},{"key":"D","text":"Homework tasks, since the platform logs each task"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Whatever shares staff must land in one arm together. Schools are the unit, and schools that share teachers count as one.","misconceptions":["Picks the unit with the most rows and ignores that classmates affect each other","Stops one level too low: teachers shared between schools carry the platform across","","Takes the row of the log for the unit"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"interference-between-units","title":"If one unit's treatment reaches another, the unit is too small"},"level":"apply","pool":"practice"},{"id":"q-prereg-07","type":"numeric","prompt":"A test of a new counter routine logs 14,400 visits in 30 branches. Four pairs of branches share staff and each pair is treated as one unit. How many units does the test have?","options":[],"correct":[],"answer":26,"tolerance":0,"unit":"units","explanation":"Four pairs become four units in place of eight branches: 30 − 4 = 26. The 14,400 visits are rows, not units.","misconceptions":[],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"rows-are-not-units","title":"The size of a test is its number of units, not its number of rows"},"level":"apply","pool":"practice"},{"id":"q-prereg-08","type":"single","prompt":"A pre-registration says holders will be 'analysed as assigned'. During the test, 4% of the reminder arm never receive the reminder because of a system fault. How are these holders treated in the analysis?","options":[{"key":"A","text":"They are moved to the control arm, since they got no reminder"},{"key":"B","text":"They are removed, since they did not receive the treatment"},{"key":"C","text":"They are analysed separately as a third arm"},{"key":"D","text":"They stay in the reminder arm, where the coin put them"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Analysis as assigned keeps every unit in the arm that chance chose. It estimates the effect of deciding to send reminders, failures included.","misconceptions":["Regroups by what happened, which breaks the comparability the coin created","Drops units from one arm only, and those units are not a random handful","Creates a group that chance did not assign",""],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"analysis-plan","title":"The analysis plan is one paragraph that leaves you no choice later"},"level":"understand","pool":"practice"},{"id":"q-prereg-09","type":"single","prompt":"A team pre-registered completion as the primary metric of a form test. Halfway through, an analyst proposes to add time on page as a further metric. What is the sound way to do it?","options":[{"key":"A","text":"Replace completion with time on page if it shows a clearer result"},{"key":"B","text":"Add it with a date and report it as exploratory"},{"key":"C","text":"Add it and treat both as primary"},{"key":"D","text":"Refuse: nothing may be added after the start"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Additions after the start are allowed when dated and labelled exploratory. What decides, when the test stops and who counts may not change.","misconceptions":["Lets the data choose the metric that decides","","Doubles the chances of a win after seeing interim data","Reads the page as a ceiling when it is a floor"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"why-write-it-down","title":"A pre-registration removes the choices you would make after seeing the data"},"level":"evaluate","pool":"practice"},{"id":"q-prereg-10","type":"order","prompt":"Put these steps of designing a test in the order in which they should be settled.","options":[{"key":"A","text":"Write the decision the result will change"},{"key":"B","text":"Choose one primary metric and its minimum effect"},{"key":"C","text":"Choose the unit of randomisation"},{"key":"D","text":"Compute the sample size and the duration"},{"key":"E","text":"Have someone else review the page"},{"key":"F","text":"Assign the first unit"}],"correct":[0,1,2,3,4,5],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision comes first because everything else serves it; the metric and minimum effect come before the size because the size depends on them; the review comes before the first unit is assigned, never after.","misconceptions":["","","","","",""],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"one-page-twelve-items","title":"One page, twelve items"},"level":"apply","pool":"practice"},{"id":"q-size-01","type":"single","prompt":"A city tests a new recycling leaflet at a 5% significance level with 80% power for a 3-point effect. In truth the leaflet raises recycling by exactly 3 points. How often will a test of this design fail to show a significant result?","options":[{"key":"A","text":"About 5 times in 100"},{"key":"B","text":"About 20 times in 100"},{"key":"C","text":"About 80 times in 100"},{"key":"D","text":"Never, because the effect is real"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Power of 80% means that a real effect of the stated size is found 80 times in 100 and missed 20 times.","misconceptions":["Uses the significance level, which describes the case where there is no effect","","Takes the power for the chance of missing the effect","Assumes that a real effect always shows, as if samples did not vary"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"two-ways-to-be-wrong","title":"A test can be wrong in two ways, and you choose both rates in advance"},"level":"understand","pool":"practice"},{"id":"q-size-02","type":"numeric","prompt":"A test needs 5,000 customers per arm to detect an effect of 4 points. The manager decides that 2 points would already justify the change. How many customers per arm does the test need now, to the nearest thousand?","options":[],"correct":[],"answer":20000,"tolerance":500,"unit":"customers per arm","explanation":"The effect is squared in the denominator of the sample-size formula. Half the effect needs four times the size: 4 × 5,000 = 20,000.","misconceptions":[],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"halve-the-effect","title":"Halve the minimum effect and the test needs four times the holders"},"level":"apply","pool":"practice"},{"id":"q-size-03","type":"single","prompt":"Two offices plan the same test with the same minimum effect of 2 points. Office A has a baseline of 50%, office B a baseline of 90%. Which office needs more people per arm, and why?","options":[{"key":"A","text":"Office B, because a high baseline leaves less room to improve"},{"key":"B","text":"Both need the same, because the minimum effect is the same"},{"key":"C","text":"Office B, because 2 points is a smaller share of 90%"},{"key":"D","text":"Office A, because a yes-or-no outcome is noisiest near 50%"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The variance p(1 − p) is 0.25 at 50% and 0.09 at 90%. More noise needs more people for the same difference in points.","misconceptions":["Reasons about ceilings and not about the variance of the outcome","Forgets that the spread of a yes-or-no outcome depends on its rate","Thinks in relative terms when the test is planned in points",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"what-drives-the-size","title":"Three things drive the sample size, and one of them is squared"},"level":"analyze","pool":"practice"},{"id":"q-size-04","type":"numeric","prompt":"A test needs 7,200 applicants per arm, and both arms fill from the same stream. The service receives 900 applicants a day on average. How many days of average traffic fill the test?","options":[],"correct":[],"answer":16,"tolerance":0,"unit":"days","explanation":"Both arms together need 14,400 applicants. At 900 a day that is 16 days.","misconceptions":[],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"size-for-two-points","title":"Two points on a baseline of 61.58% need 9,187 holders per arm"},"level":"apply","pool":"practice"},{"id":"q-not-worse-01","type":"single","prompt":"Building works permits: the office tests an e-mail renewal notice in place of a posted one. The pre-registration fixed a not-worse margin of 1.5 points. With 5,000 holders per arm, on-time renewal is 0.4 points lower with e-mail, 95% interval −2.2 to +1.4 points, p = 0.67 for no difference. The write-up concludes that e-mail is not worse. What should a reviewer say?","options":[{"key":"A","text":"Not shown: the interval still reaches beyond the 1.5-point margin"},{"key":"B","text":"Shown: a p-value of 0.67 means the e-mail and posted notices perform the same"},{"key":"C","text":"Not shown: the estimate is below zero, so e-mail is shown to be worse"},{"key":"D","text":"Shown, once the margin is widened to 2.5 points after the result"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Not worse is shown only when the lower end of the 95% interval lies above minus the margin. Here the lower end is −2.2 points, beyond −1.5, so a loss larger than the office accepts is still possible. The p-value tests no difference, which is not the question, and a margin moved after the result proves nothing.","misconceptions":["","Reads a large p-value for no difference as proof that the two notices are the same","Reads an estimate below zero as a proven loss, though the interval includes zero","Moves the margin after seeing the data, so any result can pass"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"not-worse-four-results","title":"Four finished tests, one margin of 2 points: only the interval decides"},"level":"evaluate","pool":"practice"},{"id":"q-size-05","type":"single","prompt":"An analyst simulates a planned test 400 times and finds a power of 77%. The formula gave 80%. Two standard errors of a share near 0.8 counted over 400 runs are about 4 points. What should she conclude?","options":[{"key":"A","text":"The formula is wrong and the test needs more people"},{"key":"B","text":"The simulation is wrong, since it disagrees with the formula"},{"key":"C","text":"The two agree within the simulation's own error"},{"key":"D","text":"The power is exactly 77%, since a simulation uses real draws"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"77% and 80% differ by 3 points, less than the counting error of 4. To tighten the comparison she can run more simulated tests.","misconceptions":["Reads a difference inside the counting error as a real disagreement","Treats the formula as the truth and the simulation as its imitation","","Forgets that a count over 400 runs is itself an estimate"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"simulated-power","title":"The simulation agrees with the formula, within its own counting error"},"level":"analyze","pool":"practice"},{"id":"q-size-06","type":"single","prompt":"A team will analyse its test with a t-test on the mean rating per clinic. To check the power by simulation, what must the simulated analysis be?","options":[{"key":"A","text":"The same t-test on clinic means, run on simulated clinics"},{"key":"B","text":"A z-test on all patients, because it has more rows"},{"key":"C","text":"Whichever test gives the highest simulated power"},{"key":"D","text":"No test: the simulated effect is compared with the true effect"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A power simulation rehearses the analysis that will really be run, at the unit that will really be analysed.","misconceptions":["","Simulates a different analysis from the one that will be run","Chooses the analysis by its result, which is what a plan is meant to prevent","Checks the estimate's accuracy and not how often the planned test detects the effect"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"simulate-the-plan","title":"To check a design, run it a thousand times in a world you built"},"level":"evaluate","pool":"practice"},{"id":"q-size-07","type":"numeric","prompt":"In a test that randomises health centres, the intraclass correlation of the outcome is 0.02 and each centre contributes 201 patients. What is the design effect?","options":[],"correct":[],"answer":5,"tolerance":0.05,"unit":"","explanation":"Design effect = 1 + (m − 1) × ICC = 1 + 200 × 0.02 = 5. The variance of the estimate is five times that of a patient-randomised test of the same size.","misconceptions":[],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"design-effect","title":"A small correlation times a large branch is a large penalty"},"level":"apply","pool":"practice"},{"id":"q-size-08","type":"single","prompt":"A test randomises 20 post offices, 10 per arm, and its simulated power is 35%. The team can afford one of four changes. Which one raises the power most?","options":[{"key":"A","text":"Doubling the number of customers surveyed in each office"},{"key":"B","text":"Analysing customers one by one in place of office averages"},{"key":"C","text":"Raising the significance level's precision to four decimals"},{"key":"D","text":"Adding 20 more post offices to the test"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"In a cluster-randomised test the number of clusters is the main lever. More customers per office hardly help once each office's rate is measured well.","misconceptions":["Shrinks only the sampling part of each office's rate; the difference between offices stays","Inflates false wins and does not add information","Changes how a number is printed, not what the data can show",""],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"what-buys-power-in-clusters","title":"More branches help; more visits per branch hardly do"},"level":"evaluate","pool":"practice"},{"id":"q-size-09","type":"single","prompt":"A test randomised 24 branches and found no difference in branch averages (p = 0.40). A second analyst reanalyses the 11,000 visits as independent observations and reports p = 0.001. Which analysis should the office trust?","options":[{"key":"A","text":"The visit-level one, because 11,000 observations beat 24"},{"key":"B","text":"The branch-level one, because branches were randomised"},{"key":"C","text":"Neither, because two analyses of one test must agree"},{"key":"D","text":"The visit-level one, because its p-value is smaller"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The unit of analysis must be the unit of randomisation. The visit-level test treats luck in which branches landed where as an effect; in simulation it declares a win most of the time when nothing differs.","misconceptions":["Counts rows as units: visits in one branch are not independent","","Expects agreement between a valid and an invalid analysis","Chooses the analysis by its result"],"lo":["LO5"],"day":2,"session":3,"slide":{"deck":"day2","id":"visit-level-analysis","title":"Analysing visits from a branch-randomised test manufactures wins"},"level":"analyze","pool":"practice"},{"id":"q-size-10","type":"single","prompt":"Before randomising 18 libraries, a team sorts them by last year's lending rate, pairs neighbours in the list and tosses a coin inside each pair. Why does this raise the power of the test?","options":[{"key":"A","text":"It doubles the number of libraries in the analysis"},{"key":"B","text":"It guarantees that the treated libraries perform better"},{"key":"C","text":"It removes stable differences between libraries from the comparison"},{"key":"D","text":"It lets the team choose which library of a pair is treated"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Libraries in a pair started at the same level, so the comparison inside pairs is free of the stable differences between libraries, which are most of the noise.","misconceptions":["Thinks pairing adds units; it adds none","Mistakes a design that removes noise for one that creates an effect","","Forgets the coin: a chosen assignment would bring bias back"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"pairing-recovers-power","title":"Pairing like branches recovers much of the lost power"},"level":"understand","pool":"practice"},{"id":"q-size-11","type":"single","prompt":"A test of a booking page starts on a Sunday. Weekend traffic is half of weekday traffic, and bookings surge in the last four days of each month. The planned sample size is reached on day 10, which is the 12th of the month. Which duration should the team choose?","options":[{"key":"A","text":"10 days, since the size is reached"},{"key":"B","text":"14 days, two whole weeks"},{"key":"C","text":"21 days, three whole weeks"},{"key":"D","text":"28 days, four whole weeks"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The run should cover whole weeks and the month-end. From the 3rd, 28 days reach the 30th and include the surge; 21 days end on the 23rd.","misconceptions":["Stops at the size and leaves some weekdays counted twice and others once","Covers whole weeks and misses the month-end surge","Ends on the 23rd, before the surge starts",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"whole-cycles","title":"Run whole weeks, and cover the month-end"},"level":"apply","pool":"practice"},{"id":"q-size-12","type":"single","prompt":"Two teams test the same reminder for 8 days each. Team A, in the first half of the month, estimates +1.8 points. Team B, at the month-end, estimates +3.3 points. Both tests are sound. What is the most likely reason for the gap?","options":[{"key":"A","text":"One team made an error in its analysis"},{"key":"B","text":"Each test estimates the effect for the days it covered"},{"key":"C","text":"Team B had more people and so a larger effect"},{"key":"D","text":"The reminder got better between the two tests"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"If a reminder helps more in the month-end rush, a test that covers only part of the monthly cycle estimates the effect for that part.","misconceptions":["Assumes that two correct tests must give the same number","","Confuses the precision of an estimate with its size","Invents a change in the treatment to explain a difference in the window"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"short-test-different-question","title":"A short test answers a different question"},"level":"analyze","pool":"practice"},{"id":"q-size-13","type":"single","prompt":"A test sends notices for 28 days. The primary metric is renewal by the expiry date, which is 30 days after each notice. An analyst wants to report the result on day 29. What is wrong with that?","options":[{"key":"A","text":"Nothing: all notices have been sent"},{"key":"B","text":"The sample ratio cannot be checked before day 58 of the test"},{"key":"C","text":"The test should have stopped at day 9 instead"},{"key":"D","text":"Late-notified holders have not reached their expiry date"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The metric is complete for a holder only at the expiry date. The last holders reach it 30 days after the last notice.","misconceptions":["Takes the end of sending for the end of the outcome","Ties a check on assignment to the outcome window, which it does not need","Returns to the sample size and ignores the question asked",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"outcome-window-and-novelty","title":"Two more clocks run: the outcome window and the fading of novelty"},"level":"understand","pool":"practice"},{"id":"q-read-01","type":"single","prompt":"An analyst opens the export of a finished two-arm test. Which of these should she compute first?","options":[{"key":"A","text":"The difference in the primary metric between the arms"},{"key":"B","text":"The p-value of the primary metric"},{"key":"C","text":"The number of units in each arm against the planned split"},{"key":"D","text":"The effect in the subgroup that the sponsor cares about most"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The checks on the assignment come before any outcome: sample ratio, then balance, then completeness. A result from a broken comparison is not worth reading.","misconceptions":["Reads the result before knowing whether the comparison is intact","Starts from the verdict and leaves the checks for later, when they will look like pedantry","","Starts with an exploratory cut, the least reliable number of the test"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"checks-before-result","title":"Check the assignment before you look at the outcome"},"level":"understand","pool":"practice"},{"id":"q-read-02","type":"single","prompt":"A test planned a 50/50 split. The data hold 50,400 units in one arm and 49,600 in the other, and a chi-square test against equal counts gives p = 0.011. The team's pre-registered line for this check is 0.001. What follows?","options":[{"key":"A","text":"The check fails, since 0.011 is below 0.05"},{"key":"B","text":"The check passes, and the analysis goes ahead as planned"},{"key":"C","text":"The check passes, so the test is proven sound"},{"key":"D","text":"The check cannot be run with arms this large"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The line was set in advance at 0.001, and 0.011 is above it. The check passes. A pass does not prove that everything else is sound.","misconceptions":["Applies the usual 0.05 where the page set a stricter line for a check that runs on every test","","Reads a passed check as proof; it rules out one family of faults only","Believes that large samples invalidate the check, when they make it sharper"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"sample-ratio-check","title":"49.05% in the reminder arm is not what a fair coin gives"},"level":"analyze","pool":"practice"},{"id":"q-read-03","type":"single","prompt":"In a test of a new reminder, 900 members assigned to the reminder arm are missing from the results file because their messages bounced. The assignment log and the outcome of every member are available. Which analysis estimates the effect of deciding to send the reminder?","options":[{"key":"A","text":"Compare everyone as assigned, bounced included"},{"key":"B","text":"Compare only the members whose messages arrived"},{"key":"C","text":"Remove 900 members at random from the control arm too"},{"key":"D","text":"Move the bounced members into the control arm"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Analysis as assigned keeps the comparison the coin created. It measures the effect of the decision, delivery failures included.","misconceptions":["","Drops units after assignment, so the arms no longer differ by the coin alone","Equalises the counts and leaves the arms different in who is in them","Reassigns units by what happened to them, which breaks the randomisation"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"coin-was-fair","title":"The coin was fair. The export broke afterwards"},"level":"analyze","pool":"practice"},{"id":"q-read-04","type":"numeric","prompt":"In a test, 4,200 of 10,000 control units and 4,500 of 10,000 treated units succeeded. The standard error of the difference is 0.7 points. What is the lower end of the 95% interval for the difference, in points? Use 1.96, and answer to one decimal place.","options":[],"correct":[],"answer":1.6,"tolerance":0.05,"unit":"points","explanation":"The difference is 45.0 − 42.0 = 3.0 points. The margin is 1.96 × 0.7 = 1.4 points, so the interval runs from 1.6 to 4.4.","misconceptions":[],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"estimate-and-interval","title":"The reminder raised on-time renewal by 2.17 points, give or take 0.77"},"level":"apply","pool":"practice"},{"id":"q-read-05","type":"single","prompt":"A test with a minimum effect of 2 points finds +2.4 points, with a 95% interval from 0.9 to 3.9. Which sentence reports it correctly?","options":[{"key":"A","text":"The effect is 2.4 points and exceeds the minimum, so the case is closed"},{"key":"B","text":"The effect is below the minimum, since the interval starts at 0.9"},{"key":"C","text":"The test found nothing, since the interval includes values under 2"},{"key":"D","text":"There is a gain; whether it reaches 2 points is not settled"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Zero is outside the interval, so there is a gain. The minimum effect of 2 is inside the interval, so the data do not settle whether the gain reaches it.","misconceptions":["Reads the estimate as if it had no uncertainty","Reads the lower limit as the estimate","Takes 'may be below the minimum' for 'no effect'",""],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"reading-against-the-minimum","title":"An interval can sit in four places, and each has its own sentence"},"level":"evaluate","pool":"practice"},{"id":"q-read-06","type":"single","prompt":"A guardrail says: stop if complaints rise by more than 0.5 points. The test finds +0.1 points, with a 95% interval from −0.5 to +0.7. What can the result note say?","options":[{"key":"A","text":"The guardrail held: complaints rose by only 0.1 points"},{"key":"B","text":"No rise was found, and a rise above the threshold is not ruled out"},{"key":"C","text":"The guardrail was crossed: the interval reaches 0.7"},{"key":"D","text":"Complaints did not change, since the result is not significant"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval contains zero and also values above 0.5. The honest sentence says both: no rise found, and the test was not precise enough to rule out a rise above the threshold.","misconceptions":["Reads the estimate and ignores that the interval reaches beyond the threshold","","Reads the upper limit as the estimate","Takes 'not significant' for 'no change'"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"guardrails-with-intervals","title":"Guardrails are read with their intervals too"},"level":"analyze","pool":"practice"},{"id":"q-read-07","type":"single","prompt":"A test reports an effect of +3.1 points for new customers (interval 0.2 to 6.0) and +1.4 points for returning customers (interval −0.1 to 2.9). The write-up says: \"the change works for new customers and not for returning ones\". What is the fault in that sentence?","options":[{"key":"A","text":"Nothing: one interval excludes zero and the other does not"},{"key":"B","text":"The two effects should have been averaged into one"},{"key":"C","text":"It does not test the difference between the two effects"},{"key":"D","text":"New customers are too few to be analysed at all"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The claim is about a difference between subgroups, and that difference (1.7 points) has its own, wide interval that includes zero. The two intervals overlap almost entirely.","misconceptions":["Treats 'significant in one, not in the other' as evidence of a difference","Removes the subgroup question in place of answering it","","Rejects a subgroup for its size when the interval already shows the uncertainty"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"subgroups-with-care","title":"Compare subgroups by the interval of their difference"},"level":"evaluate","pool":"practice"},{"id":"q-read-08","type":"single","prompt":"Which opening of a result note gives a director most to act on?","options":[{"key":"A","text":"\"The test was statistically significant (p = 0.004).\""},{"key":"B","text":"\"Sign-ups rose by 1.8 points (0.6 to 3.0), against a minimum of 1.\""},{"key":"C","text":"\"We ran a z-test for two proportions on 40,000 users over four weeks.\""},{"key":"D","text":"\"The new page performed better across most of the metrics we examined.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Estimate and interval in the units of the decision, then the reading against the minimum effect. Method and checks follow underneath.","misconceptions":["Gives a verdict with no size and no reading against the decision","","Leads with the method and leaves the reader to find the answer","Reports a direction over an unnamed set of metrics, with no size"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"result-in-two-sentences","title":"The result note leads with two sentences the director can act on"},"level":"apply","pool":"practice"},{"id":"q-traps-01","type":"single","prompt":"A team runs 200 A/A tests on its platform, each analysed once at a 5% level with one metric at the right unit. About how many should come out significant if the platform is healthy?","options":[{"key":"A","text":"None, since the two arms get the same thing"},{"key":"B","text":"About 10"},{"key":"C","text":"About 50"},{"key":"D","text":"About 190"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With no true effect, a 5% level produces a significant result about 5 times in 100: about 10 of 200. Many more than that points to a fault in the pipeline or the analysis.","misconceptions":["Forgets that the 5% level is a rate of false alarms when nothing differs","","Uses a quarter, with no link to the 5% level","Takes the level for the share of correct results"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"aa-tests","title":"In an A/A test nothing differs, so every win is false"},"level":"understand","pool":"practice"},{"id":"q-traps-02","type":"single","prompt":"A manager checks the dashboard of a four-week test every morning and plans to stop on the first day the p-value is below 0.05. Nothing truly differs between the arms. What is the chance that the test is declared a win?","options":[{"key":"A","text":"5%, as the significance level says"},{"key":"B","text":"Below 5%, since looking more often is more careful"},{"key":"C","text":"Far above 5%, since each look is a further chance to cross"},{"key":"D","text":"Exactly 28 times 5%, one share per look"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A p-value wanders as data arrive. Stopping at the first crossing turns 28 looks into 28 chances; in the lab's simulation about 28% of A/A tests were declared wins.","misconceptions":["Applies the level of one planned analysis to a procedure with many looks","Thinks extra looks add rigour, when each is a further chance of a false win","","Adds the chances as if the looks were unrelated and could exceed 100%"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"peeking","title":"A p-value wanders, and 28 looks give it 28 chances to cross 0.05"},"level":"analyze","pool":"practice"},{"id":"q-traps-03","type":"numeric","prompt":"A dashboard shows 10 unrelated metrics for an A/A test, each tested at a 5% level. What is the chance, in per cent, that at least one is significant? Answer to the nearest whole number (0.95 to the power 10 is 0.599).","options":[],"correct":[],"answer":40,"tolerance":0.6,"unit":"%","explanation":"The chance that none of ten crosses is 0.95 to the power 10 = 0.599. The chance that at least one does is 1 − 0.599 = 0.401, about 40%.","misconceptions":[],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"twenty-metrics","title":"With twenty metrics, most tests of nothing show a \"significant\" one"},"level":"apply","pool":"practice"},{"id":"q-traps-04","type":"single","prompt":"A team wants to look at 15 metrics after its test and still keep the chance of a false win near 5%. Which plan achieves that?","options":[{"key":"A","text":"Decide on one primary metric named in advance"},{"key":"B","text":"Report whichever of the 15 has the smallest p-value"},{"key":"C","text":"Test each of the 15 at 5% and report all that cross"},{"key":"D","text":"Raise the sample size until one metric crosses"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Either one pre-registered primary metric carries the decision, or the 15 are corrected for their number, for example with Holm's method. The other metrics can still be reported as exploratory.","misconceptions":["","Selects the winner after the fact, which is the trap itself","Keeps 5% per metric and lets the chance of at least one false win grow past half","Adds peeking to many comparisons"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"twenty-metrics","title":"With twenty metrics, most tests of nothing show a \"significant\" one"},"level":"evaluate","pool":"practice"},{"id":"q-traps-05","type":"single","prompt":"A site randomises 4,000 visitors to two layouts and records 60,000 clicks. An analyst compares the share of failed clicks with a test that treats every click as independent. Why does this produce too many false wins?","options":[{"key":"A","text":"Clicks are too many for a z-test to handle"},{"key":"B","text":"The share of failed clicks is a ratio, and ratios cannot be tested at all"},{"key":"C","text":"Visitors were not assigned at random"},{"key":"D","text":"One visitor's clicks are alike, so the standard error is too small"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The information lies in 4,000 visitors, not in 60,000 clicks. Treating repeated clicks as independent understates the standard error, and ordinary luck in who landed where looks like an effect.","misconceptions":["Blames the size of the data and not their dependence","Rejects the metric when the fault is the unit of the analysis","Disputes the randomisation, which was sound",""],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"wrong-unit-of-analysis","title":"Counting page views for applicants turns luck into significance"},"level":"analyze","pool":"practice"},{"id":"q-traps-06","type":"single","prompt":"A test stopped on day 6 of a planned 28 because the p-value crossed 0.05, and it reports an effect of +6 points. The minimum effect in the plan was 2. Why should the size of the effect be distrusted as well as the win?","options":[{"key":"A","text":"Effects always shrink in the second week"},{"key":"B","text":"With little data, only large swings cross the line"},{"key":"C","text":"Six days cannot contain enough units for any estimate"},{"key":"D","text":"The minimum effect limits how large an estimate may be"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Early on, the standard error is large, so a difference has to be large to cross 0.05. Tests that stop at a crossing therefore report exaggerated effects.","misconceptions":["States a rule about novelty that is not general","","Rejects any early estimate, whatever its interval","Takes a planning threshold for a ceiling on the result"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"one-planned-look","title":"One analysis at the planned end restores the 5%"},"level":"understand","pool":"practice"},{"id":"q-review-01","type":"single","prompt":"A colleague hands you a write-up of an experiment and asks for a review. What do you read first?","options":[{"key":"A","text":"The headline result and its p-value"},{"key":"B","text":"The recommendation, to see what is being asked"},{"key":"C","text":"The subgroup tables, since problems tend to hide in the detail"},{"key":"D","text":"What the plan promised: unit, metric, size, stop rule"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The review order is design, checks, analysis, claim. Only against the plan can you tell whether the analysis that was run is the one that was promised.","misconceptions":["Starts with the claim and spends the rest of the review defending or attacking it","Starts from the end of the chain of evidence","Starts with the exploratory material before the design is known",""],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"review-order","title":"Review in a fixed order: design, checks, analysis, claim"},"level":"understand","pool":"practice"},{"id":"q-review-02","type":"single","prompt":"A pre-registration names \"share of applicants who finish the form\" as the primary metric. The write-up's headline is \"time on page fell by 9%, p = 0.01\", and the finishing rate appears in a footnote as \"unchanged\". Which flaw is this?","options":[{"key":"A","text":"A missing control arm"},{"key":"B","text":"A sample ratio mismatch"},{"key":"C","text":"A switch of the primary metric"},{"key":"D","text":"A run that was too short"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision was tied to the finishing rate before the test. Leading with another metric that happened to move is a switch of the primary metric after seeing the data.","misconceptions":["Names a design flaw that the write-up does not have","Names a fault of the assignment where the fault is in what is reported","","Names the duration, which the excerpt says nothing about"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"seven-flaws","title":"Seven flaws, each with a place in the text"},"level":"analyze","pool":"practice"},{"id":"q-review-03","type":"single","prompt":"A write-up states: \"the new arm logged 12% fewer users than the old one; we attribute this to chance\". The log is attached. What should the reviewer do?","options":[{"key":"A","text":"Accept the statement, since the author knows the system"},{"key":"B","text":"Run the ratio check and split the counts by segment"},{"key":"C","text":"Reject the whole write-up without further reading"},{"key":"D","text":"Ask the author to remove the sentence from the write-up"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A claim of chance can be tested in two lines: the ratio check gives its probability, and a split by segment shows where units are missing.","misconceptions":["Takes a checkable claim on trust","","Stops before finding out what the gap means for the decision","Hides the symptom and leaves the cause"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"recompute-two-claims","title":"A review that only reads is an opinion: recompute"},"level":"apply","pool":"practice"},{"id":"q-review-04","type":"single","prompt":"Which closing paragraph makes a review memo most useful to the person who must decide?","options":[{"key":"A","text":"\"The analysis has several flaws and its conclusions cannot be trusted.\""},{"key":"B","text":"\"The author should attend a course on experiment design.\""},{"key":"C","text":"\"The evidence supports a rerun as planned, not a roll-out.\""},{"key":"D","text":"\"Every flaw in our catalogue may apply to some degree.\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A memo goes from each flaw to its consequence to the decision the evidence does support, and names the next step.","misconceptions":["Ends at the verdict and leaves the decision-maker with nothing to do","Addresses the person and not the decision","","Lists everything and so tells the reader nothing about this write-up"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"flaw-consequence-decision","title":"The memo goes from each flaw to its consequence to a decision"},"level":"evaluate","pool":"practice"},{"id":"q-review-05","type":"single","prompt":"A test of a new payment page shows the same average completion in both arms. The device table shows that no user of one older browser appears in the new arm, while 6% of the old arm uses it. What should the review say about roll-out?","options":[{"key":"A","text":"Roll out: average completion is unchanged"},{"key":"B","text":"Roll out to everyone except the users of that older browser"},{"key":"C","text":"Drop the new page, since it has been shown to fail"},{"key":"D","text":"Do not roll out: the new page may fail for those users"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Missing units in one arm, concentrated in one group, suggest that the new page does not work for that group. The average hides it. Fix the fault and run the test again.","misconceptions":["Trusts an average computed without the users the new page lost","Proposes a split that nobody tested and that leaves those users without a page","Overreads one fault as a verdict on the whole design",""],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"finding-nobody-wanted","title":"The test did find something, and the write-up put it down to chance"},"level":"analyze","pool":"practice"},{"id":"q-review-06","type":"single","prompt":"A new, brightly coloured button was tested for 5 days and raised clicks by 4 points. The write-up projects the gain over a full year. Which doubt should the review raise first?","options":[{"key":"A","text":"The first reaction to something new may fade"},{"key":"B","text":"Clicks cannot be measured reliably over five days"},{"key":"C","text":"A gain of 4 points is too large to be believed"},{"key":"D","text":"Buttons should be tested on branches, not on users"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A short test of a visible change measures the reaction at its peak. Projecting it over a year assumes that the novelty never wears off; the effect by week over a longer run would show whether it does.","misconceptions":["","Questions the measurement where the issue is what the window represents","Rejects a result for its size alone","Changes the unit without a reason from the design"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"novelty-and-attrition","title":"Novelty fades and attrition unbalances, even when the analysis is right"},"level":"analyze","pool":"practice"}]}</script>
