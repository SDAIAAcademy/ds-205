<section>
<h2>Day 1: Design</h2>
<ol>
<li><p>Mansour Al-Khelaiwi wants to know whether evening opening shortens waits. Four studies are possible. Which one supports "evening opening caused shorter waits" without a further assumption?</p><ul><li><b>A.</b> Compare the branches whose managers asked for evening opening with the rest</li><li><b>B.</b> Draw 12 of the 24 branches by a recorded lottery for evening opening and compare with the other 12</li><li><b>C.</b> Open all branches in the evening from June and compare waits before and after</li><li><b>D.</b> Compare the waits of evening visitors with those of daytime visitors</li></ul></li>
<li><p>Rehab Al-Tayyar's team redesigned the online application form so that more applicants finish it. Which is the primary metric of the test?</p><ul><li><b>A.</b> Mean time spent on each page of the form</li><li><b>B.</b> Validation errors per page view</li><li><b>C.</b> Whichever of completion, errors and time improves most</li><li><b>D.</b> The share of applicants who complete the application</li></ul></li>
<li><p>The office wants to test a shorter text on the ticket that the queue machine prints. All visitors of a branch wait in one hall and watch one display. What is the unit of randomisation?</p><ul><li><b>A.</b> The branch, or the staff pool where branches share staff</li><li><b>B.</b> The visitor: each ticket printed gets a coin</li><li><b>C.</b> The day: the short text on alternate days in every branch</li><li><b>D.</b> The ticket: it is what the machine logs</li></ul></li>
<li><p>On day 10 of the reminder test the team has three ideas. Which one is compatible with the pre-registration?</p><ul><li><b>A.</b> Make counter visits the primary metric, because they are moving more clearly</li><li><b>B.</b> End the test today, because the difference is already significant</li><li><b>C.</b> Add days until renewal as an exploratory metric, labelled as added on day 10</li><li><b>D.</b> Drop holders whose reminder bounced from the reminder arm</li></ul></li>
<li><p>A city library offers a new late-return text alert. Members opt in at the desk. After three months, members with the alert return 12 points more books on time than members without it. What kind of study is this?</p><ul><li><b>A.</b> A randomised experiment, because two groups are compared</li><li><b>B.</b> A quasi-experiment, because the alert started on a fixed date</li><li><b>C.</b> An observational comparison, because members chose the alert</li><li><b>D.</b> A lottery, because not every member received the alert</li></ul></li>
<li><p>A transport office finds that drivers who use its mobile app renew their licences on time 20 points more often than drivers who do not. A simulation shows that conscientious drivers both install the app more and renew on time more. What does the 20-point gap mostly measure?</p><ul><li><b>A.</b> The difference between conscientious drivers and the others</li><li><b>B.</b> The effect of the app on every driver who chooses to install it this year</li><li><b>C.</b> The sampling error of a survey of drivers</li><li><b>D.</b> The effect of on-time renewal on app use</li></ul></li>
<li><p>Three separate surveys of clinic patients all find that patients who booked online miss fewer appointments, by 9, 10 and 11 points. A manager says the agreement proves that online booking reduces missed appointments. What is the best reply?</p><ul><li><b>A.</b> Three surveys are too few; ten would settle it</li><li><b>B.</b> The surveys share one weakness: patients chose how to book</li><li><b>C.</b> The surveys disagree by 2 points, so none can be trusted</li><li><b>D.</b> The effect is real, since chance cannot produce it three times</li></ul></li>
<li><p>A municipality waives a parking fee for cars registered before 2015. An analyst compares permit renewals of cars registered in late 2014 with cars registered in early 2015. On which assumption does a causal reading rest?</p><ul><li><b>A.</b> That the two groups have the same number of cars</li><li><b>B.</b> That owners chose their registration year at random</li><li><b>C.</b> That renewals were measured in the same month for all cars</li><li><b>D.</b> That nothing but the fee changes at the 2015 line</li></ul></li>
<li><p>A housing office has 300 places on a home-repair scheme and 1,400 eligible applicants. Places are allocated by a recorded random draw. One year later, energy bills of the two groups are compared. Which claim does the comparison support?</p><ul><li><b>A.</b> The scheme lowered bills for applicants like these</li><li><b>B.</b> The scheme lowers bills for every household in the city</li><li><b>C.</b> Households on the scheme have lower bills; the reason is unknown</li><li><b>D.</b> The scheme lowers bills only if bills were moving in parallel before</li></ul></li>
<li><p>A health centre knows from strong earlier trials that a reminder call reduces missed vaccinations. A manager proposes a new test in which half of the parents get no call, to measure the effect locally. What is the main objection?</p><ul><li><b>A.</b> The test would need too many parents to reach significance</li><li><b>B.</b> The local effect cannot differ from the earlier trials</li><li><b>C.</b> Half of the parents would be denied a benefit shown to work</li><li><b>D.</b> Parents cannot be randomised without written consent in every case</li></ul></li>
<li><p>Four teams wrote the decision line of a pre-registration for a new queue ticket. Which line gives the director a rule she can apply on the last day?</p><ul><li><b>A.</b> We will learn whether the new ticket improves the experience of visitors in our branches</li><li><b>B.</b> If waits fall by at least 2 minutes and complaints do not rise, we adopt it</li><li><b>C.</b> If the result is significant we adopt the ticket in all branches</li><li><b>D.</b> We adopt the ticket unless the test shows that it is harmful</li></ul></li>
<li><p>A text reminder costs 0.30 riyals per resident. Each missed bulky-waste collection costs the city 15 riyals. By how many points must the reminder reduce missed collections to pay for itself? <span class="unit">(points)</span></p></li>
<li><p>On-time payment is 40%. A report says a new letter raised it 'by 5%'. A colleague reads this as 45%, another as 42%. Which wording removes the doubt?</p><ul><li><b>A.</b> It raised on-time payment by 5 per cent of payers</li><li><b>B.</b> It raised on-time payment significantly, by 5%</li><li><b>C.</b> It raised on-time payment by roughly a twentieth of all payers</li><li><b>D.</b> It raised on-time payment by 5 points, from 40% to 45%</li></ul></li>
<li><p>A tax office tests a firmer payment letter. Which of these is a complete guardrail?</p><ul><li><b>A.</b> We will monitor complaints closely throughout the test</li><li><b>B.</b> Complaints must not rise; if they do, we will discuss it</li><li><b>C.</b> If the complaint rate exceeds control by 1 point, pause and review the letter</li><li><b>D.</b> Complaints are a secondary metric and will be reported</li></ul></li>
<li><p>A utility tests two versions of its bill. Its system tosses a coin for every bill printed. One customer in four has several meters and gets several bills. What goes wrong?</p><ul><li><b>A.</b> Customers with several meters would see both versions</li><li><b>B.</b> The arms will have unequal numbers of bills</li><li><b>C.</b> Bills cannot be analysed because they are not people</li><li><b>D.</b> The test will need four times as many bills to reach the same power</li></ul></li>
<li><p>A school district wants to test a new homework platform. Pupils in a class work together and share one teacher. Three pairs of small schools share their teaching staff. What should be randomised?</p><ul><li><b>A.</b> Pupils, since there are far more of them</li><li><b>B.</b> Classes, since pupils in a class share a teacher</li><li><b>C.</b> Schools, treating each pair that shares staff as one unit</li><li><b>D.</b> Homework tasks, since the platform logs each task</li></ul></li>
<li><p>A test of a new counter routine logs 14,400 visits in 30 branches. Four pairs of branches share staff and each pair is treated as one unit. How many units does the test have? <span class="unit">(units)</span></p></li>
<li><p>A pre-registration says holders will be 'analysed as assigned'. During the test, 4% of the reminder arm never receive the reminder because of a system fault. How are these holders treated in the analysis?</p><ul><li><b>A.</b> They are moved to the control arm, since they got no reminder</li><li><b>B.</b> They are removed, since they did not receive the treatment</li><li><b>C.</b> They are analysed separately as a third arm</li><li><b>D.</b> They stay in the reminder arm, where the coin put them</li></ul></li>
<li><p>A team pre-registered completion as the primary metric of a form test. Halfway through, an analyst proposes to add time on page as a further metric. What is the sound way to do it?</p><ul><li><b>A.</b> Replace completion with time on page if it shows a clearer result</li><li><b>B.</b> Add it with a date and report it as exploratory</li><li><b>C.</b> Add it and treat both as primary</li><li><b>D.</b> Refuse: nothing may be added after the start</li></ul></li>
<li><p>Put these steps of designing a test in the order in which they should be settled.</p><ul><li>Write the decision the result will change</li><li>Compute the sample size and the duration</li><li>Assign the first unit</li><li>Choose one primary metric and its minimum effect</li><li>Choose the unit of randomisation</li><li>Have someone else review the page</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Size and run</h2>
<ol>
<li><p>Four pre-registrations for the reminder test differ in one line each. Which line is acceptable?</p><ul><li><b>A.</b> Primary metric: on-time renewal or counter visits, whichever is clearer</li><li><b>B.</b> Unit: the renewal notice, since that is what the platform sends</li><li><b>C.</b> Stop rule: 28 days, one analysis at the end, a safety look at the guardrails on day 14</li><li><b>D.</b> Guardrail: we will keep an eye on complaints</li></ul></li>
<li><p>A test needs 6,000 residents per arm to detect 3 points. The director now says she would act on 1.5 points. About how many residents per arm does the test need?</p><ul><li><b>A.</b> 24,000</li><li><b>B.</b> 12,000</li><li><b>C.</b> 6,000</li><li><b>D.</b> 1,500</li></ul></li>
<li><p>You simulate a planned test 1,000 times with a true effect of 2 points. 81% of the simulated tests are significant. Which statement is correct?</p><ul><li><b>A.</b> There is an 81% chance that the reminder works</li><li><b>B.</b> If the real test is significant, the effect is real with probability 81%</li><li><b>C.</b> The reminder will raise on-time renewal by 81% of 2 points</li><li><b>D.</b> If the effect is really 2 points, a test of this design finds it about 81 times in 100</li></ul></li>
<li><p>A ministry tests a new enrolment procedure in 16 schools, 8 with it and 8 without. Each school enrols about 600 pupils. The outcome is whether a pupil's file is complete on the first day. What decides the power of the test most?</p><ul><li><b>A.</b> The 9,600 pupils</li><li><b>B.</b> The 16 schools and how much schools differ from each other</li><li><b>C.</b> The 600 pupils in each school</li><li><b>D.</b> The 5% significance level</li></ul></li>
<li><p>A test of a new payment page starts on a Sunday. The planned size is reached on day 11. Traffic is low at weekends and salaries arrive on the 27th, after which payments surge. Day 11 is the 16th of the month. What duration do you choose?</p><ul><li><b>A.</b> 11 days</li><li><b>B.</b> 14 days</li><li><b>C.</b> 28 days</li><li><b>D.</b> As long as it takes to reach significance</li></ul></li>
<li><p>A city tests a new recycling leaflet at a 5% significance level with 80% power for a 3-point effect. In truth the leaflet raises recycling by exactly 3 points. How often will a test of this design fail to show a significant result?</p><ul><li><b>A.</b> About 5 times in 100</li><li><b>B.</b> About 20 times in 100</li><li><b>C.</b> About 80 times in 100</li><li><b>D.</b> Never, because the effect is real</li></ul></li>
<li><p>A test needs 5,000 customers per arm to detect an effect of 4 points. The manager decides that 2 points would already justify the change. How many customers per arm does the test need now, to the nearest thousand? <span class="unit">(customers per arm)</span></p></li>
<li><p>Two offices plan the same test with the same minimum effect of 2 points. Office A has a baseline of 50%, office B a baseline of 90%. Which office needs more people per arm, and why?</p><ul><li><b>A.</b> Office B, because a high baseline leaves less room to improve</li><li><b>B.</b> Both need the same, because the minimum effect is the same</li><li><b>C.</b> Office B, because 2 points is a smaller share of 90%</li><li><b>D.</b> Office A, because a yes-or-no outcome is noisiest near 50%</li></ul></li>
<li><p>A test needs 7,200 applicants per arm, and both arms fill from the same stream. The service receives 900 applicants a day on average. How many days of average traffic fill the test? <span class="unit">(days)</span></p></li>
<li><p>Building works permits: the office tests an e-mail renewal notice in place of a posted one. The pre-registration fixed a not-worse margin of 1.5 points. With 5,000 holders per arm, on-time renewal is 0.4 points lower with e-mail, 95% interval −2.2 to +1.4 points, p = 0.67 for no difference. The write-up concludes that e-mail is not worse. What should a reviewer say?</p><ul><li><b>A.</b> Not shown: the interval still reaches beyond the 1.5-point margin</li><li><b>B.</b> Shown: a p-value of 0.67 means the e-mail and posted notices perform the same</li><li><b>C.</b> Not shown: the estimate is below zero, so e-mail is shown to be worse</li><li><b>D.</b> Shown, once the margin is widened to 2.5 points after the result</li></ul></li>
<li><p>An analyst simulates a planned test 400 times and finds a power of 77%. The formula gave 80%. Two standard errors of a share near 0.8 counted over 400 runs are about 4 points. What should she conclude?</p><ul><li><b>A.</b> The formula is wrong and the test needs more people</li><li><b>B.</b> The simulation is wrong, since it disagrees with the formula</li><li><b>C.</b> The two agree within the simulation's own error</li><li><b>D.</b> The power is exactly 77%, since a simulation uses real draws</li></ul></li>
<li><p>A team will analyse its test with a t-test on the mean rating per clinic. To check the power by simulation, what must the simulated analysis be?</p><ul><li><b>A.</b> The same t-test on clinic means, run on simulated clinics</li><li><b>B.</b> A z-test on all patients, because it has more rows</li><li><b>C.</b> Whichever test gives the highest simulated power</li><li><b>D.</b> No test: the simulated effect is compared with the true effect</li></ul></li>
<li><p>In a test that randomises health centres, the intraclass correlation of the outcome is 0.02 and each centre contributes 201 patients. What is the design effect?</p></li>
<li><p>A test randomises 20 post offices, 10 per arm, and its simulated power is 35%. The team can afford one of four changes. Which one raises the power most?</p><ul><li><b>A.</b> Doubling the number of customers surveyed in each office</li><li><b>B.</b> Analysing customers one by one in place of office averages</li><li><b>C.</b> Raising the significance level's precision to four decimals</li><li><b>D.</b> Adding 20 more post offices to the test</li></ul></li>
<li><p>A test randomised 24 branches and found no difference in branch averages (p = 0.40). A second analyst reanalyses the 11,000 visits as independent observations and reports p = 0.001. Which analysis should the office trust?</p><ul><li><b>A.</b> The visit-level one, because 11,000 observations beat 24</li><li><b>B.</b> The branch-level one, because branches were randomised</li><li><b>C.</b> Neither, because two analyses of one test must agree</li><li><b>D.</b> The visit-level one, because its p-value is smaller</li></ul></li>
<li><p>Before randomising 18 libraries, a team sorts them by last year's lending rate, pairs neighbours in the list and tosses a coin inside each pair. Why does this raise the power of the test?</p><ul><li><b>A.</b> It doubles the number of libraries in the analysis</li><li><b>B.</b> It guarantees that the treated libraries perform better</li><li><b>C.</b> It removes stable differences between libraries from the comparison</li><li><b>D.</b> It lets the team choose which library of a pair is treated</li></ul></li>
<li><p>A test of a booking page starts on a Sunday. Weekend traffic is half of weekday traffic, and bookings surge in the last four days of each month. The planned sample size is reached on day 10, which is the 12th of the month. Which duration should the team choose?</p><ul><li><b>A.</b> 10 days, since the size is reached</li><li><b>B.</b> 14 days, two whole weeks</li><li><b>C.</b> 21 days, three whole weeks</li><li><b>D.</b> 28 days, four whole weeks</li></ul></li>
<li><p>Two teams test the same reminder for 8 days each. Team A, in the first half of the month, estimates +1.8 points. Team B, at the month-end, estimates +3.3 points. Both tests are sound. What is the most likely reason for the gap?</p><ul><li><b>A.</b> One team made an error in its analysis</li><li><b>B.</b> Each test estimates the effect for the days it covered</li><li><b>C.</b> Team B had more people and so a larger effect</li><li><b>D.</b> The reminder got better between the two tests</li></ul></li>
<li><p>A test sends notices for 28 days. The primary metric is renewal by the expiry date, which is 30 days after each notice. An analyst wants to report the result on day 29. What is wrong with that?</p><ul><li><b>A.</b> Nothing: all notices have been sent</li><li><b>B.</b> The sample ratio cannot be checked before day 58 of the test</li><li><b>C.</b> The test should have stopped at day 9 instead</li><li><b>D.</b> Late-notified holders have not reached their expiry date</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Read the result</h2>
<ol>
<li><p>A test needs 9,000 residents per arm for its minimum effect. Traffic is 2,000 residents a day, lower at weekends, with a surge at the month-end. Which plan do you accept?</p><ul><li><b>A.</b> Run 9 days, until 18,000 residents are in</li><li><b>B.</b> Run 28 days: whole weeks, with the month-end inside</li><li><b>C.</b> Run 9 days with 4,500 per arm to finish sooner</li><li><b>D.</b> Run until the difference is significant</li></ul></li>
<li><p>A form test planned a 50/50 split. The log shows 10,480 applicants on the old form and 9,720 on the new one (p below 0.0001). The new form shows a higher completion rate. What do you do first?</p><ul><li><b>A.</b> Report the higher completion rate, with a note that the arms were unequal</li><li><b>B.</b> Delete 760 applicants at random from the old form's arm</li><li><b>C.</b> Reweight the new form's arm so that both arms count the same</li><li><b>D.</b> Find which applicants are missing from the new form's arm, and why</li></ul></li>
<li><p>A test of a new letter has a minimum effect of 3 points. The result: +1.2 points, 95% interval +0.4 to +2.0, p = 0.003. Which sentence is right?</p><ul><li><b>A.</b> The letter helps, by less than the 3 points that would justify it</li><li><b>B.</b> The letter is highly effective: the result is significant at 0.003</li><li><b>C.</b> The letter has no effect, since it missed the minimum effect</li><li><b>D.</b> The test is inconclusive and should run longer</li></ul></li>
<li><p>A team planned a 4-week test of a new queue screen in 30 branches with one primary metric. They analysed it once, at the end, and report: "average wait fell, p = 0.01, n = 41,000 visits". Which trap should you check first?</p><ul><li><b>A.</b> Peeking</li><li><b>B.</b> Many metrics</li><li><b>C.</b> Wrong unit of analysis</li><li><b>D.</b> Novelty</li></ul></li>
<li><p>A write-up reports a randomised test of a new appointment text, analysed as pre-registered: missed appointments fell by 1.9 points (0.4 to 3.4), against a minimum effect of 1.5. It then recommends the text "for all clinics, and for vaccination reminders too". The test ran in the city's eight clinics. What do you write?</p><ul><li><b>A.</b> Reject the write-up: the claim goes beyond the evidence</li><li><b>B.</b> Adopt the text for appointments in the eight clinics; test vaccination reminders separately</li><li><b>C.</b> Accept the recommendation as written: the test was sound</li><li><b>D.</b> Ask for a longer test before deciding anything</li></ul></li>
<li><p>An analyst opens the export of a finished two-arm test. Which of these should she compute first?</p><ul><li><b>A.</b> The difference in the primary metric between the arms</li><li><b>B.</b> The p-value of the primary metric</li><li><b>C.</b> The number of units in each arm against the planned split</li><li><b>D.</b> The effect in the subgroup that the sponsor cares about most</li></ul></li>
<li><p>A test planned a 50/50 split. The data hold 50,400 units in one arm and 49,600 in the other, and a chi-square test against equal counts gives p = 0.011. The team's pre-registered line for this check is 0.001. What follows?</p><ul><li><b>A.</b> The check fails, since 0.011 is below 0.05</li><li><b>B.</b> The check passes, and the analysis goes ahead as planned</li><li><b>C.</b> The check passes, so the test is proven sound</li><li><b>D.</b> The check cannot be run with arms this large</li></ul></li>
<li><p>In a test of a new reminder, 900 members assigned to the reminder arm are missing from the results file because their messages bounced. The assignment log and the outcome of every member are available. Which analysis estimates the effect of deciding to send the reminder?</p><ul><li><b>A.</b> Compare everyone as assigned, bounced included</li><li><b>B.</b> Compare only the members whose messages arrived</li><li><b>C.</b> Remove 900 members at random from the control arm too</li><li><b>D.</b> Move the bounced members into the control arm</li></ul></li>
<li><p>In a test, 4,200 of 10,000 control units and 4,500 of 10,000 treated units succeeded. The standard error of the difference is 0.7 points. What is the lower end of the 95% interval for the difference, in points? Use 1.96, and answer to one decimal place. <span class="unit">(points)</span></p></li>
<li><p>A test with a minimum effect of 2 points finds +2.4 points, with a 95% interval from 0.9 to 3.9. Which sentence reports it correctly?</p><ul><li><b>A.</b> The effect is 2.4 points and exceeds the minimum, so the case is closed</li><li><b>B.</b> The effect is below the minimum, since the interval starts at 0.9</li><li><b>C.</b> The test found nothing, since the interval includes values under 2</li><li><b>D.</b> There is a gain; whether it reaches 2 points is not settled</li></ul></li>
<li><p>A guardrail says: stop if complaints rise by more than 0.5 points. The test finds +0.1 points, with a 95% interval from −0.5 to +0.7. What can the result note say?</p><ul><li><b>A.</b> The guardrail held: complaints rose by only 0.1 points</li><li><b>B.</b> No rise was found, and a rise above the threshold is not ruled out</li><li><b>C.</b> The guardrail was crossed: the interval reaches 0.7</li><li><b>D.</b> Complaints did not change, since the result is not significant</li></ul></li>
<li><p>A test reports an effect of +3.1 points for new customers (interval 0.2 to 6.0) and +1.4 points for returning customers (interval −0.1 to 2.9). The write-up says: "the change works for new customers and not for returning ones". What is the fault in that sentence?</p><ul><li><b>A.</b> Nothing: one interval excludes zero and the other does not</li><li><b>B.</b> The two effects should have been averaged into one</li><li><b>C.</b> It does not test the difference between the two effects</li><li><b>D.</b> New customers are too few to be analysed at all</li></ul></li>
<li><p>Which opening of a result note gives a director most to act on?</p><ul><li><b>A.</b> "The test was statistically significant (p = 0.004)."</li><li><b>B.</b> "Sign-ups rose by 1.8 points (0.6 to 3.0), against a minimum of 1."</li><li><b>C.</b> "We ran a z-test for two proportions on 40,000 users over four weeks."</li><li><b>D.</b> "The new page performed better across most of the metrics we examined."</li></ul></li>
<li><p>A team runs 200 A/A tests on its platform, each analysed once at a 5% level with one metric at the right unit. About how many should come out significant if the platform is healthy?</p><ul><li><b>A.</b> None, since the two arms get the same thing</li><li><b>B.</b> About 10</li><li><b>C.</b> About 50</li><li><b>D.</b> About 190</li></ul></li>
<li><p>A manager checks the dashboard of a four-week test every morning and plans to stop on the first day the p-value is below 0.05. Nothing truly differs between the arms. What is the chance that the test is declared a win?</p><ul><li><b>A.</b> 5%, as the significance level says</li><li><b>B.</b> Below 5%, since looking more often is more careful</li><li><b>C.</b> Far above 5%, since each look is a further chance to cross</li><li><b>D.</b> Exactly 28 times 5%, one share per look</li></ul></li>
<li><p>A dashboard shows 10 unrelated metrics for an A/A test, each tested at a 5% level. What is the chance, in per cent, that at least one is significant? Answer to the nearest whole number (0.95 to the power 10 is 0.599). <span class="unit">(%)</span></p></li>
<li><p>A team wants to look at 15 metrics after its test and still keep the chance of a false win near 5%. Which plan achieves that?</p><ul><li><b>A.</b> Decide on one primary metric named in advance</li><li><b>B.</b> Report whichever of the 15 has the smallest p-value</li><li><b>C.</b> Test each of the 15 at 5% and report all that cross</li><li><b>D.</b> Raise the sample size until one metric crosses</li></ul></li>
<li><p>A site randomises 4,000 visitors to two layouts and records 60,000 clicks. An analyst compares the share of failed clicks with a test that treats every click as independent. Why does this produce too many false wins?</p><ul><li><b>A.</b> Clicks are too many for a z-test to handle</li><li><b>B.</b> The share of failed clicks is a ratio, and ratios cannot be tested at all</li><li><b>C.</b> Visitors were not assigned at random</li><li><b>D.</b> One visitor's clicks are alike, so the standard error is too small</li></ul></li>
<li><p>A test stopped on day 6 of a planned 28 because the p-value crossed 0.05, and it reports an effect of +6 points. The minimum effect in the plan was 2. Why should the size of the effect be distrusted as well as the win?</p><ul><li><b>A.</b> Effects always shrink in the second week</li><li><b>B.</b> With little data, only large swings cross the line</li><li><b>C.</b> Six days cannot contain enough units for any estimate</li><li><b>D.</b> The minimum effect limits how large an estimate may be</li></ul></li>
<li><p>A colleague hands you a write-up of an experiment and asks for a review. What do you read first?</p><ul><li><b>A.</b> The headline result and its p-value</li><li><b>B.</b> The recommendation, to see what is being asked</li><li><b>C.</b> The subgroup tables, since problems tend to hide in the detail</li><li><b>D.</b> What the plan promised: unit, metric, size, stop rule</li></ul></li>
<li><p>A pre-registration names "share of applicants who finish the form" as the primary metric. The write-up's headline is "time on page fell by 9%, p = 0.01", and the finishing rate appears in a footnote as "unchanged". Which flaw is this?</p><ul><li><b>A.</b> A missing control arm</li><li><b>B.</b> A sample ratio mismatch</li><li><b>C.</b> A switch of the primary metric</li><li><b>D.</b> A run that was too short</li></ul></li>
<li><p>A write-up states: "the new arm logged 12% fewer users than the old one; we attribute this to chance". The log is attached. What should the reviewer do?</p><ul><li><b>A.</b> Accept the statement, since the author knows the system</li><li><b>B.</b> Run the ratio check and split the counts by segment</li><li><b>C.</b> Reject the whole write-up without further reading</li><li><b>D.</b> Ask the author to remove the sentence from the write-up</li></ul></li>
<li><p>Which closing paragraph makes a review memo most useful to the person who must decide?</p><ul><li><b>A.</b> "The analysis has several flaws and its conclusions cannot be trusted."</li><li><b>B.</b> "The author should attend a course on experiment design."</li><li><b>C.</b> "The evidence supports a rerun as planned, not a roll-out."</li><li><b>D.</b> "Every flaw in our catalogue may apply to some degree."</li></ul></li>
<li><p>A test of a new payment page shows the same average completion in both arms. The device table shows that no user of one older browser appears in the new arm, while 6% of the old arm uses it. What should the review say about roll-out?</p><ul><li><b>A.</b> Roll out: average completion is unchanged</li><li><b>B.</b> Roll out to everyone except the users of that older browser</li><li><b>C.</b> Drop the new page, since it has been shown to fail</li><li><b>D.</b> Do not roll out: the new page may fail for those users</li></ul></li>
<li><p>A new, brightly coloured button was tested for 5 days and raised clicks by 4 points. The write-up projects the gain over a full year. Which doubt should the review raise first?</p><ul><li><b>A.</b> The first reaction to something new may fade</li><li><b>B.</b> Clicks cannot be measured reliably over five days</li><li><b>C.</b> A gain of 4 points is too large to be believed</li><li><b>D.</b> Buttons should be tested on branches, not on users</li></ul></li>
</ol>
